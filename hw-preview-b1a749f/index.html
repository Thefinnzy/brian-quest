// combat.js — THE swappable damage/crit formula. combat.md v1.1 §1a "Edge vs Guard" (VK approved; reference: tools/combat-v1.js).
// att/def are combatant views: { atk, def, dex }. rng() -> [0,1). Same interface as the old DQ file (maxNormal keeps aiChoose working).
//   normal = max(1, round(0.56 x ATK^2 / (ATK + DEF) x V)), V = 0.9 + 0.2 x U   (Graze: never below 1)
//   keen (crit): chance 3% + 0.2% x DEX; damage max(2, round(2.5 x 0.56 x ATK^2 / (ATK + DEF) x V)); DEF still counts (no crit ignores armor)
(function (root) {
  const K = 0.56, G = 1, C0 = 0.03, KEEN = 2.5;
  const base = (att, def) => K * att.atk * att.atk / Math.max(1, att.atk + G * def.def);
  const Combat = {
    id: 'v1-edge-guard', K, G, C0, KEEN,
    critChance: att => C0 + att.dex * 0.002,
    crit: (att, rng) => rng() < Combat.critChance(att),
    // one rng() draw (V) per hit, crit or not
    damage(att, def, rng, isCrit) { const v = 0.9 + rng() * 0.2; return isCrit ? Math.max(2, Math.round(base(att, def) * KEEN * v)) : Math.max(1, Math.round(base(att, def) * v)); },
    // Largest normal (non-crit) hit, used by the sim's block AI.
    maxNormal: (att, def) => Math.max(1, Math.round(base(att, def) * 1.1)),

  if (typeof module !== 'undefined') module.exports = Combat; else root.Combat = Combat;
})(this);

// sprite-load.js (appended to the generated sprites.js by build.py). pass8: SPRITES holds PNGs (base64). Decode each once at boot into RGBA,
// then art.js and menu.js read pixels synchronously via spriteRGBA(name) -> [w, h, Uint8ClampedArray] (null until decoded / unknown).
// The PNGs carry no colour profile and only alpha 0 / 255 (build.py bakes the magenta key), so a canvas round trip is exact.
(function (root) {
  const PX = root.SPRITE_PX = {};
  const bytes = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  const toPx = (img, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0); return g.getImageData(0, 0, w, h).data; };
  const viaImg = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  function one(name, [w, h, b64]) {
    const blob = new Blob([bytes(b64)], { type: 'image/png' });
    const p = root.createImageBitmap ? createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }).catch(() => viaImg('data:image/png;base64,' + b64)) : viaImg('data:image/png;base64,' + b64);
    return p.then(img => { PX[name] = toPx(img, w, h); if (img.close) img.close(); });
  }
  root.spriteRGBA = name => { const S = (root.SPRITES || {})[name]; return S && PX[name] ? [S[0], S[1], PX[name]] : null; };
  const all = Object.entries(root.SPRITES || {}).map(([n, s]) => one(n, s).catch(e => console.error('[hearthwood] sprite decode failed: ' + n, e)));
  root.SPRITES_READY = Promise.all(all);
})(this);
