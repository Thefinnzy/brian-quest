#stage{position:absolute;left:0;top:0;width:384px;height:216px;transform-origin:0 0}
#cv{position:absolute;left:0;top:0;width:384px;height:216px;image-rendering:pixelated;image-rendering:crisp-edges}
#pads{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
#pads.idle .vis{opacity:.33}
body.kbd #pads{display:none}
.hit{position:absolute;pointer-events:auto}
.vis{position:absolute;box-sizing:border-box;background:rgba(18,22,58,.45);border:1px solid rgba(246,238,214,.7);display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.hit.on .vis{background:rgba(244,204,92,.75)}
.vis svg{width:12px;height:12px;fill:rgba(246,238,214,.8)}
.round .vis{border-radius:50%;color:rgba(255,216,120,.9);font:bold 14px sans-serif}
.round.on .vis{background:rgba(176,120,32,.8)}
#namegrid{position:fixed;left:0;right:0;bottom:0;height:45%;background:linear-gradient(#2c3478,#12163a);border-top:3px solid #f6eed6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}
.ng-row{display:flex;gap:4px}
.ng-key{width:48px;height:44px;border:1px solid #7484e0;border-radius:4px;background:#12163a;color:#f0ecdc;font:bold 18px monospace;padding:0}
.ng-key:active{background:#f4cc5c;color:#1c1020}
.ng-key.wide{width:64px;font-size:14px}.ng-key.ok{background:#f4cc5c;color:#1c1020}
/* safe areas (QA #8) */
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
/* portrait (QA #7): pads leave the play field and sit in a control deck under it, >=44px targets, clear of the home bar */
body.portrait #pads{position:fixed;left:var(--sal);right:var(--sar);bottom:var(--sab);top:auto;height:240px;inset:auto var(--sar) var(--sab) var(--sal)}
body.portrait #pads .hit{transform:none}
body.portrait [data-btn=up]{left:80px!important;top:16px!important;width:64px!important;height:64px!important}
body.portrait [data-btn=down]{left:80px!important;top:144px!important;width:64px!important;height:64px!important}
body.portrait [data-btn=left]{left:16px!important;top:80px!important;width:64px!important;height:64px!important}
body.portrait [data-btn=right]{left:144px!important;top:80px!important;width:64px!important;height:64px!important}
body.portrait [data-btn=A]{left:auto!important;right:20px!important;top:48px!important;width:80px!important;height:80px!important}
body.portrait [data-btn=B]{left:auto!important;right:116px!important;top:120px!important;width:72px!important;height:72px!important}
body.portrait #pads .vis{left:4px!important;top:4px!important;width:calc(100% - 8px)!important;height:calc(100% - 8px)!important}
body.portrait #pads .vis svg{width:20px;height:20px}
body.portrait .round .vis{font-size:22px}
#namegrid{padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}

  function updateField(dt) {

    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) Art.ground(ctx, m, x, y, x * TS - camX, y * TS - camY, now, World);
    const list = [];
    for (let y = y0; y < y1 + 2; y++) for (let x = x0; x < x1; x++) { const t = World.tileAt(m, x, y), sx = x * TS - camX, sy = y * TS - camY, hv = G.hash(x, y);
      if (t === 'f') list.push([sy + 16, () => ctx.drawImage(Art.tree(((now / 600 | 0) + x) % 2 && hv % 3 === 0 ? 1 : 0), sx - 1, sy - 5 - (y % 2 ? 0 : 0))]);
      else if (t === 'h') list.push([sy + 12, () => ctx.drawImage(Art.hill(), sx - 1, sy + 3)]);
      else if (t === 'M') list.push([sy + 16, () => ctx.drawImage(Art.mountain(hv % 2), sx - 1, sy - 9)]);
      else if (t === 'T') list.push([sy + 16, () => ctx.drawImage(Art.townMarker(), sx - 1, sy - 5)]);
      else if (t === 'o') list.push([sy + 16, () => ctx.drawImage(Art.well(), sx - 3, sy - 6)]);
      else if (t === 'l') list.push([sy + 16, () => { Art.shadow(ctx, sx + 8, sy + 14, 8, 3); ctx.drawImage(Art.lamp((now / 120 | 0) % 3), sx + 4, sy - 14); }]);
      else if (t === 'c') list.push([sy + 16, () => { Art.shadow(ctx, sx + 8, sy + 14, 10, 4); ctx.drawImage(Art.crate(), sx + 1, sy + 2); }]);
      else if (t === 'S') list.push([sy + 16, () => { Art.shadow(ctx, sx + 8, sy + 15, 8, 3); ctx.drawImage(Art.signpost(), sx + 2, sy - 1); }]);
      else if (t === 'r') list.push([sy + 16, () => { Art.shadow(ctx, sx + 8, sy + 15, 8, 3); ctx.drawImage(Art.barrel(), sx + 2, sy); }]); }
    if (m.buildings) for (const b of m.buildings) list.push([(b.y + b.h) * TS - camY, () => Art.building(ctx, b, b.x * TS - camX, b.y * TS - camY)]);
    const actor = (look, body, dir, frame, ax, ay) => list.push([ay + 16, () => { Art.shadow(ctx, ax + 8, ay + 15, 12, 4); ctx.drawImage(Art.actor(look, body, dir, frame), ax - 1, ay - 9); }]);
    if (m.npcs) for (const n of m.npcs) actor(n.look, n.look === 'shop' ? 'jill' : 'joe', n.dir, (now / 500 | 0) % 2 ? 0 : 0, n.x * TS - camX, n.y * TS - camY - ((now / 500 | 0) % 2));
    { const pk = game.s.pack; if (pk && pk.map === game.s.map) { const sx = pk.x * TS - camX, sy = pk.y * TS - camY, bob = (now / 300 | 0) % 2;
      list.push([sy + 15, () => { Art.shadow(ctx, sx + 8, sy + 13, 10, 3); ctx.fillStyle = '#5c352e'; ctx.fillRect(sx + 3, sy + 5 - bob, 10, 8); ctx.fillStyle = '#a16948'; ctx.fillRect(sx + 4, sy + 4 - bob, 8, 7); ctx.fillStyle = '#ca9660'; ctx.fillRect(sx + 4, sy + 4 - bob, 8, 2); ctx.fillStyle = '#f4cc5c'; ctx.fillRect(sx + 7, sy - 4 - bob, 2, 5); ctx.fillRect(sx + 6, sy - 5 - bob, 4, 2); const pl = game.pl; if (Math.abs(pl.x - pk.x) + Math.abs(pl.y - pk.y) <= 3) G.text(ctx, T('m1.pack.marker'), sx + 8, sy - 14 - bob, '#ffd878', 'center', '#000'); }]); } }

    const walking = p.move || (p.blocked && game.held.length), fr = walking ? [0, 1, 0, 3][(p.walkT / (p.move ? 120 : 150) | 0) % 4] : 0, c = game.s.char;
    actor(c.race, c.body, p.dir, fr, ppx - camX, ppy - camY - (!walking && (now / 500 | 0) % 2 ? 1 : 0));
    list.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
    if (c.hp <= 3 && game.s.map === 'overworld') { const wx = ppx - camX + 8, wy = ppy - camY - 18; ctx.fillStyle = '#1c1020'; ctx.fillRect(wx - 3, wy - 1, 7, 11); ctx.fillStyle = '#ff6a5a'; ctx.fillRect(wx - 2, wy, 5, 9); ctx.fillStyle = '#fff6dc'; ctx.fillRect(wx, wy + 1, 1, 4); ctx.fillRect(wx, wy + 7, 1, 1); }
    // ambient day tint
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(255,224,168,.12)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    // HUD
    TBX.frame(ctx, 4, 4, 92, 40); G.text(ctx, c.name, 10, 9, '#ffd878'); G.text(ctx, 'HP', 10, 20, '#f0ecdc'); G.text(ctx, c.hp + '/' + c.maxHp, 90, 20, c.hp < c.maxHp * .25 ? '#ff6a5a' : '#ffd878', 'right'); G.text(ctx, Rules.fmtMoney(c.coin), 90, 31, '#ffd878', 'right'); G.text(ctx, 'Herb ' + c.herbs, 10, 31, '#f0ecdc');
    G.text(ctx, m.name, W - 8, 8, '#f0ecdc', 'right');
    for (const o of game.ov) o.draw(ctx, now);
    if (game.fade) { const f = game.fade, a = 1 - Math.abs(f.t / (f.dur / 2) - 1); ctx.fillStyle = `rgba(7,6,15,${Math.min(1, a * 1.2)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- input ----------
  const DIRS = ['up', 'down', 'left', 'right'];
  function press(b) {
    pokePads();
    if (game.mode === 'creator') { if (!game.kbd) creatorButton(b); return; }
    if (game.mode === 'battle') return game.battle && game.battle.button(b);
    if (game.fade) return;
    const o = top(); if (o) { if (o instanceof TBX.Dialog) { if (b === 'A' || b === 'B') o.advance(); } else o.button(b); return; }
    if (DIRS.includes(b)) { if (!game.pl.move) tryStep(b); } else if (b === 'A') talkFacing(); else if (b === 'B') fieldMenu();
  }
  function hold(b) { if (DIRS.includes(b)) { game.held = game.held.filter(x => x !== b); game.held.push(b); } press(b); }
  function release(b) { game.held = game.held.filter(x => x !== b); }
  function tap(x, y) {
    pokePads();
    if (game.mode === 'creator') { if (!game.kbd) creatorTap(x, y); return; }
    if (game.mode === 'battle') return game.battle && game.battle.tap(x, y);
    const o = top(); if (!o) return; if (o instanceof TBX.Dialog) o.advance(); else if (!o.tap(x, y) && !(x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h)) o.onCancel();
  }
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', z: 'A', Enter: 'A', ' ': 'A', x: 'B', Escape: 'B' };
  window.addEventListener('keydown', e => { const b = KEYS[e.key]; if (!b) return; e.preventDefault(); if (!e.repeat) hold(b); });
  window.addEventListener('keyup', e => { const b = KEYS[e.key]; if (b) release(b); });
  const ptr = new Map();
  document.querySelectorAll('[data-btn]').forEach(el => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); const b = el.dataset.btn; ptr.set(e.pointerId, b); el.classList.add('on'); hold(b); });
  });

  cv.addEventListener('pointerdown', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); tap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); });

    st.style.top = Math.round(portrait ? Math.max(ins.t + 8, innerHeight - ins.b - 248 - H * s) : ins.t + (ah - H * s) / 2) + 'px';

})(this);
