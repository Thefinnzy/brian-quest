*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07060f;color:#f0ecdc;font:16px/1.25 BQPixel,monospace;-webkit-font-smoothing:none;font-smooth:never;image-rendering:pixelated}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1a1838,#07060f 70%)}
#app{display:flex;gap:8px;padding:8px;max-width:1280px;margin:0 auto;align-items:flex-start}
#left{flex:0 0 auto;width:min(100%,780px);display:flex;flex-direction:column;gap:6px}
#right{flex:1;min-width:300px;display:flex;flex-direction:column;gap:6px}
@media (max-width:980px){#app{flex-direction:column;padding:4px;gap:4px}#left,#right{width:100%;min-width:0}}
.win{background:linear-gradient(180deg,#3448a8 0%,#1c2670 40%,#10164a 100%);border:3px solid #e8e8f8;outline:2px solid #0a0a1c;border-radius:4px;box-shadow:inset 0 0 0 2px #5a6ac8,0 3px 0 #000a;padding:6px 8px}
header{display:flex;justify-content:space-between;align-items:center}
header b{color:#ffd860;letter-spacing:1px}#where{color:#b8c4ff}
#hdrR{display:flex;gap:8px;align-items:center}#gold{color:#ffd860}
#stage{padding:3px;background:#0a0a1c;position:relative}
#cv{display:block;width:100%;aspect-ratio:256/176;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.bar{position:relative;height:18px;background:#0a0a1c;border:2px solid #000;box-shadow:0 0 0 1px #8890c8}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .25s}
.bar span{position:relative;display:block;text-align:center;font-size:16px;line-height:14px;text-shadow:1px 1px #000}
.hp i{background:repeating-linear-gradient(180deg,#ff6a5a 0 4px,#d03030 4px 9px,#801828 9px 14px)}
.xp i{background:repeating-linear-gradient(180deg,#a8e0ff 0 4px,#4a8ef0 4px 9px,#28408a 9px 14px)}
.st i{background:repeating-linear-gradient(180deg,#f0f080 0 4px,#c0a030 4px 9px,#6a5418 9px 14px)}
.mo i{background:repeating-linear-gradient(180deg,#c8a0ff 0 4px,#8a5ad8 4px 9px,#4a2a8a 9px 14px)}
#actions{display:flex;flex-wrap:wrap;gap:5px;min-height:46px;align-items:center}
button{font:inherit;color:#f6f2e4;background:linear-gradient(180deg,#5a6ad0,#2a3488);border:2px solid #e8e8f8;outline:2px solid #0a0a1c;border-radius:3px;padding:3px 9px;cursor:pointer;text-shadow:1px 1px #0a0a1c;display:inline-flex;align-items:center;gap:4px;min-height:30px}
button:hover:not(:disabled){background:linear-gradient(180deg,#7a8af0,#3a46a8)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.on{background:linear-gradient(180deg,#e0b040,#8a5a18);color:#fff}
button.warn{background:linear-gradient(180deg,#d05a4a,#7a2028)}
button.go{background:linear-gradient(180deg,#5ac05a,#1e6a2a)}
button .cd{color:#ffd860}
.ib{padding:2px 4px;min-height:0}
img.ic{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;flex:0 0 auto}
button img.ic{width:24px;height:24px}
#tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px}
#tabs button{flex-direction:row;padding:2px 4px;gap:4px;min-height:34px;justify-content:center;overflow:hidden}
#tabs button.on{background:linear-gradient(180deg,#f0c860,#a06a20)}
@media (max-width:520px){#tabs button span{display:none}}
#panel{max-height:calc(100vh - 90px);overflow:auto;min-height:300px}
@media (max-width:980px){#panel{max-height:none}}
h3{color:#ffd860;font-size:16px;margin:6px 0 4px;letter-spacing:1px;border-bottom:2px solid #5a6ac8;padding-bottom:2px}
h4{color:#b8c4ff;font-size:16px;margin:6px 0 2px}
.row{display:flex;align-items:center;gap:6px;padding:3px 2px;border-bottom:1px solid #2a347a}
.row .grow{flex:1;min-width:0}
.row .sub{color:#a8b0e0;font-size:16px}
.muted{color:#8890c0}.good{color:#7ae07a}.bad{color:#ff7a6a}.gold{color:#ffd860}

  return C.TUNE.shopRate * T.traffic * C.PLOT_TRAFFIC[i] * (1 + .25 * b.sign) * (T.demand[cat] || 1) * C.dayDemand(town, cat, now) * (C.BUSINESS[b.type].mult[cat] || 1) * C.elastic(b.markup) * (b.clerk || present ? 1 : .35) * (fl.merchant ? 1.25 : 1) / Math.max(1, Math.sqrt(C.stockValue(e) / 40));

C.salePrice = (S, town, e, markup) => Math.round(C.stockValue(e) * markup * C.TOWNS[town].price * (C.flags(S).merchant ? 1.1 : 1) * (1 + C.heroStats(S).fx.commerce / 100));
C.shopTick = function (S, sec, now = Date.now()) {
  let total = 0; const sales = [];
  for (const [key, b] of Object.entries(S.plots)) {
    const [town, si] = key.split(':'), i = +si;
    if (b.clerk) { const w = C.clerkWage(town) * sec / 3600; b.wages += w; S.hero.gold -= w; total -= w; }
    const pas = C.BUSINESS[b.type].passive; if (pas) { const g = pas * C.TOWNS[town].traffic * C.PLOT_TRAFFIC[i] * sec / 3600; b.earned += g; S.hero.gold += g; total += g; }
    for (let s = b.stock.length - 1; s >= 0; s--) {
      const e = b.stock[s]; const lam = C.saleRate(S, town, i, e, now) * sec / 60;
      let n = 0; if (lam > 5) n = Math.round(lam + (R() - .5) * Math.sqrt(lam) * 2); else { let p = Math.exp(-lam), c = p, u = R(); while (u > c && n < 40) { n++; p *= lam / n; c += p; } }
      if (!n) continue;
      if (e.kind === 'item') n = 1; else n = Math.min(n, e.qty);
      const price = C.salePrice(S, town, e, b.markup) * n; S.hero.gold += price; b.earned += price; b.sold += n; total += price; S.stats.shopGold += price; S.stats.shopSales += n;
      sales.push({ town, name: e.kind === 'item' ? e.item.name : C.bagName(e.k), n, price });
      if (e.kind === 'item') b.stock.splice(s, 1); else { e.qty -= n; if (e.qty <= 0) b.stock.splice(s, 1); }
    }
  }

};

// ================= TRAVEL =================
C.startTravel = function (S, dest) {
  if (S.travel || dest === S.loc) return null; const p = C.findPath(S, S.loc, dest); if (!p) return null;
  S.travel = { path: p.path, seg: 0, prog: 0, dest }; S.act = 'travel'; S.camp.atCamp = false; S.dungeon = null;
  C.log(S, `Brian sets out for ${C.NODES[dest].name} (${p.path.length - 1} leg${p.path.length > 2 ? 's' : ''}).`);
  return p;
};
C.travelSeg = S => { const t = S.travel; return [t.path[t.seg], t.path[t.seg + 1]]; };
C.travelBiome = S => { const [a, b] = C.travelSeg(S); return Math.max(C.NODES[a].biome, C.NODES[b].biome); };
// advance travel by sec; returns {arrived, passed:[ids], encounter}
C.travelTick = function (S, sec) {
  const t = S.travel; if (!t) return {}; const out = { passed: [] };
  const [a, b] = C.travelSeg(S); const safe = C.NODES[a].type === 'town' || C.NODES[b].type === 'town';
  t.prog += sec; S.stats.dist += sec;
  if (R() < sec * C.TUNE.travelEncounterPerSec * (safe ? .5 : 1)) out.encounter = { biome: C.travelBiome(S) };
  const len = C.travelSec(C.edgeLen(a, b));
  if (t.prog >= len) {
    t.prog = 0; t.seg++; S.loc = b; S.seen[b] = 1; out.passed.push(b); C.drain(S, 1);
    if (t.seg >= t.path.length - 1) { S.travel = null; out.arrived = b; S.act = C.defaultAct(b); C.log(S, `Arrived at ${C.NODES[b].name}.`); }
  }
  return out;
};
C.defaultAct = id => ({ town: 'idle', zone: 'explore', fish: 'fish', mine: 'mine', station: 'mine', dungeon: 'idle' })[C.NODES[id].type];
C.travelProgress = S => { const t = S.travel; if (!t) return 0; let done = 0, total = 0; for (let i = 0; i < t.path.length - 1; i++) { const l = C.travelSec(C.edgeLen(t.path[i], t.path[i + 1])); total += l; if (i < t.seg) done += l; } done += t.prog; return done / total; };
C.travelRemaining = S => { const t = S.travel; if (!t) return 0; let r = -t.prog; for (let i = t.seg; i < t.path.length - 1; i++) r += C.travelSec(C.edgeLen(t.path[i], t.path[i + 1])); return Math.max(0, r); };

// ================= DUNGEONS =================
C.dungeonFights = n => n.floors;
C.enterDungeon = function (S) { const n = C.node(S); if (n.type !== 'dungeon') return false; S.dungeon = { node: S.loc, fight: 0 }; S.act = 'dungeon'; C.log(S, `Brian descends into ${n.name}.`); return true; };
C.dungeonBattle = function (S) {
  const n = C.node(S), d = S.dungeon, last = d.fight >= n.floors;
  const ctx = last ? { biome: n.biome, boss: true, key: n.boss, lvl: n.lvl + 2, dungeon: true, dungeonBoss: true, node: S.loc } : { biome: n.biome, lvl: n.lvl + Math.floor(d.fight / 2), dungeon: true, node: S.loc };
  return C.startBattle(S, ctx);
};

// ================= CAMP =================
C.campTick = function (S, sec) {
  const cp = S.camp, hs = C.heroStats(S), inTown = C.node(S).type === 'town' && !S.travel;
  if (cp.atCamp || inTown) {
    cp.stamina = clamp(cp.stamina + sec * (8 / 60) * (1 + .3 * (S.talents.campcraft || 0)) * (inTown ? 1.5 : 1), 0, 100);
    S.hero.hp = Math.min(hs.hp, S.hero.hp + Math.ceil(hs.hp * .05 * sec / 6));
    cp.morale += (65 - cp.morale) * Math.min(1, sec / 600);
  }
};
C.readyToLeave = S => S.camp.stamina >= 50 && S.hero.hp >= C.heroStats(S).hp * .95;

// ================= IDLE / OFFLINE =================
C.OFFLINE_TRAVEL_SEC = 18;
C.simulate = function (S, ms, opts = {}) {
  const sum = { ms, wins: 0, fights: 0, losses: 0, lvl0: S.hero.lvl, gold0: S.hero.gold, items: [], bag0: Object.assign({}, S.bag), camps: 0, bosses: [], equipped: [], restSec: 0, fish: 0, gathered: 0, shop: 0, sales: 0, arrived: null, skills0: {} };
  for (const k in S.skills) sum.skills0[k] = S.skills[k].lvl;
  let t = 0; const end = ms / 1000; S._idle = true;
  const fight = ctx => { const B = C.startBattle(S, ctx); const n = C.runAuto(S, B); t += n * 1.3; sum.fights++; if (B.result === 'win') { sum.wins++; if (B.e.boss) sum.bosses.push(B.e.name); } else if (B.result === 'lose') sum.losses++; return B; };
  try {
    let lastShop = 0;
    while (t < end) {
      if (t - lastShop >= 300) { const r = C.shopTick(S, t - lastShop, (S.last || Date.now()) + t * 1000); sum.shop += r.total; sum.sales += r.sales.length; lastShop = t; }
      const inv0 = S.inv.length;
      if (S.travel) { const o = C.travelTick(S, 10); t += 10; if (o.encounter) fight({ biome: o.encounter.biome }); if (o.arrived) sum.arrived = o.arrived; continue; }
      const n = C.node(S);
      if (S.camp.atCamp) { C.campTick(S, 60); t += 60; sum.restSec += 60; if (C.readyToLeave(S)) S.camp.atCamp = false; continue; }
      if (n.type === 'town' || S.act === 'idle') { C.campTick(S, 60); t += 60; sum.restSec += 60; continue; }
      if (S.camp.stamina <= 6) { S.camp.atCamp = true; sum.camps++; continue; }
      if (S.act === 'fish' && n.type === 'fish') { const h = C.hookFish(S, n.spot, C.timeOfDay(new Date((S.last || Date.now()) + t * 1000))); const r = C.landFish(S, h, 0, true); t += 30; if (r.fish) sum.fish += r.qty; }
      else if (S.act === 'mine' && n.ores) { const g = C.gather(S, 'mine'); t += 24; if (g) sum.gathered += Object.values(g).reduce((a, b) => a + b, 0); if (R() < .05) fight({ biome: n.biome }); }
      else if (S.act === 'forage' && n.type === 'zone') { const g = C.gather(S, 'forage'); t += 24; sum.gathered += Object.values(g).reduce((a, b) => a + b, 0); if (R() < .15) fight({ biome: n.biome }); }
      else if (n.type === 'zone' || n.type === 'dungeon') {
        const bi = n.biome;
        if (n.type === 'zone' && C.isBossZone(S.loc) && C.autoBossOk(S, bi)) { fight({ biome: bi, boss: true, zoneBoss: true }); t += 10; continue; }
        if (n.type === 'zone') { const ev = C.walkEvent(S); t += 8 + C.OFFLINE_TRAVEL_SEC; if (ev.type === 'battle') fight({ biome: bi }); else if (ev.type === 'merchant' && S.hero.gold > ev.cost * 3) { S.hero.gold -= ev.cost; S.inv.push(ev.item); } }
        else { C.drain(S, 1.2); t += 8 + C.OFFLINE_TRAVEL_SEC; fight({ biome: bi, lvl: n.lvl, node: S.loc }); }
      } else { C.campTick(S, 60); t += 60; }
      for (let i = inv0; i < S.inv.length; i++) sum.items.push(S.inv[i]);
      if (opts.autoEquip !== false) sum.equipped.push(...C.autoEquip(S));
      const hs = C.heroStats(S);
      if (S.hero.hp < hs.hp * .35 && !S.camp.atCamp) { if (C.potionCount(S) > 2) C.useCons(S, C.potionKeys(S)[0]); else { S.camp.atCamp = true; sum.camps++; } }
      S.hero.hp = Math.min(hs.hp, S.hero.hp + Math.ceil(hs.hp * .03));
    }
    const r = C.shopTick(S, Math.max(0, t - lastShop)); sum.shop += r.total; sum.sales += r.sales.length;
  } finally { delete S._idle; }
  sum.bag = {}; for (const k in S.bag) { const d = S.bag[k] - (sum.bag0[k] || 0); if (d > 0) sum.bag[k] = d; }
  sum.gold = Math.round(S.hero.gold - sum.gold0); sum.lvl = S.hero.lvl;
  sum.skillUps = Object.keys(S.skills).filter(k => S.skills[k].lvl > sum.skills0[k]).map(k => `${C.SKILL_NAMES[k]} ${sum.skills0[k]}→${S.skills[k].lvl}`);
  return sum;
};

C.migrate = function (o) {
  if (!o) return null;

    S.camp = Object.assign({ stamina: 100, morale: 70, atCamp: false }, o.camp); S.opts = Object.assign({ mute: false, auto: false }, o.opts);
    S.stats = Object.assign(C.newState().stats, o.stats); for (const k of [...C.CRAFT_SKILLS, ...C.GATHER_SKILLS]) S.skills[k] = S.skills[k] || { lvl: 1, xp: 0 };
    if (!C.NODES[S.loc]) S.loc = 'thornwick';
    return S;
  }
  if (o.v === 2) { // v2 -> v3: keep level, gold, talents, gear and boss progress
    const S = C.newState();
    S.hero.lvl = o.hero.lvl; S.hero.xp = o.hero.xp; S.hero.gold = o.hero.gold; S.talents = o.talents || {};
    S.bag['c:potion1:1'] = o.hero.potions || 0;
    const uMap = { 'Oathkeeper': 'oathkeeper', 'Emberheart': 'emberheart', "Warden's Bulwark": 'warden', 'Circlet of the Hollow King': 'hollowcrown', 'Stormstride Greaves': 'stormstride', 'Mantle of First Frost': 'firstfrost' };
    const conv = it => { if (!it) return null; if (it.unique) return C.makeItem('x', 'legendary', it.ilvl, { unique: uMap[it.unique] || 'oathkeeper' }); const slot = it.slot === 'trinket' ? 'neck' : it.slot; const n = C.makeItem(slot, it.rarity, it.ilvl, { set: it.set && C.SETS[it.set] && C.SETS[it.set].slots.includes(slot) ? it.set : undefined }); n.up = it.up || 0; return n; };
    S.equip = {}; for (const k in o.equip) { const n = conv(o.equip[k]); if (n) S.equip[n.slot] = n; }
    S.inv = (o.inv || []).map(conv).filter(Boolean);
    const mm = { hide: 'hide1', ore: 'ore1', herb: 'herb1', ember: 'ore3', frost: 'hide4', bone: 'herb5', essence: 'dust' };
    for (const k in (o.mats || {})) if (mm[k] && o.mats[k] > 0) C.bagAdd(S, mm[k], o.mats[k]);
    (o.zones || []).forEach((z, i) => { if (S.zones[i]) { S.zones[i].progress = z.progress; S.zones[i].bossDown = z.bossDown; } });
    S.stats.wins = o.stats.wins; S.stats.losses = o.stats.losses; S.stats.bosses = o.stats.bosses; S.stats.drops = o.stats.drops || {};
    S.opts = Object.assign(S.opts, o.opts); S.camp = Object.assign(S.camp, o.camp); S.camp.atCamp = false; S.hero.hp = C.heroStats(S).hp;
    S.migrated = 2; C.log(S, 'Your v2 journey carried over: level, gold, talents, gear and boss progress. Crafting skills start fresh.', 'lvl');
    return S;
  }
  return null;
};

  if (mapMode === 'local' && !S.travel) return drawLocal(m);
  const reg = mapMode === 'local' ? C.NODES[S.loc].region : mapRegion || 'heartland', inR = id => C.NODES[id].region === reg;
  m.drawImage(A.worldMap(reg), 0, 0);

    if (!meta) { if (inR(a) && inR(b)) A.road(m, C.NODES[a], C.NODES[b], open ? '#f0dca0' : 'rgba(0,0,0,.35)'); continue; }
    const mine = inR(a) ? a : inR(b) ? b : null; if (!mine) continue; const o = mine === a ? b : a, n = C.NODES[mine], ex = meta.via === 'ship' ? { x: n.x < 128 ? 4 : 252, y: n.y } : { x: n.x, y: n.y < 88 ? 4 : 172 };
    A.road(m, n, ex, open ? (meta.via === 'ship' ? '#e0f0ff' : '#f0dca0') : 'rgba(0,0,0,.4)');
    const mx = (n.x + ex.x) / 2, my = (n.y + ex.y) / 2; m.drawImage(A.nodeIcon(meta.via === 'ship' ? 'ship' : 'pass', !open), mx - 8, my - 10); const lt = 'TO ' + C.REGIONS[C.NODES[o].region].name.toUpperCase(), hw = A.textWidth(lt) / 2 + 2; A.text(m, lt, Math.max(hw, Math.min(256 - hw, mx)), Math.min(166, my + 8), open ? '#ffd860' : '#9a9aaa', 'center');
  }
  const ok = id => C.nodeUnlocked(S, id) && (!C.findPath || id === S.loc || C.findPath(S, S.loc, id) || true);
  if (S.travel) { const p = S.travel.path; for (let i = 0; i < p.length - 1; i++) if (inR(p[i]) && inR(p[i + 1])) A.road(m, C.NODES[p[i]], C.NODES[p[i + 1]], '#ffd860', 2); }
  else if (mapSel && mapSel !== S.loc) { const p = C.findPath(S, S.loc, mapSel); if (p) for (let i = 0; i < p.path.length - 1; i++) if (inR(p.path[i]) && inR(p.path[i + 1])) A.road(m, C.NODES[p.path[i]], C.NODES[p.path[i + 1]], '#7ae07a', 2); }
  const ids = Object.keys(C.NODES).filter(inR);
  for (const id of ids) { const n = C.NODES[id]; m.drawImage(A.nodeIcon(n.type, !ok(id)), n.x - 8, n.y - 10); if (id === mapSel) { m.strokeStyle = '#ffd860'; m.lineWidth = 1; m.strokeRect(n.x - 9.5, n.y - 11.5, 19, 19); } }
  for (const id of ids) { const n = C.NODES[id]; if (n.type === 'town' || id === mapSel) A.text(m, n.name, Math.max(22, Math.min(234, n.x)), Math.min(166, n.y + 8), ok(id) ? '#ffffff' : '#9a9aaa', 'center'); }
  let mx, my, show = true; if (S.travel) { const [a, b] = C.travelSeg(S), na = C.NODES[a], nb = C.NODES[b], f = Math.max(0, Math.min(1, S.travel.prog / C.travelSec(C.edgeLen(a, b)))); show = inR(a) && inR(b); mx = na.x + (nb.x - na.x) * f; my = na.y + (nb.y - na.y) * f; } else { show = inR(S.loc); mx = C.NODES[S.loc].x; my = C.NODES[S.loc].y; }
  if (show) heroMini(m, mx, my, !!S.travel);
  mapClick(mc, (x, y) => { let best = null, bd = 14; for (const id of ids) { const n = C.NODES[id]; const d = Math.hypot(n.x - x, n.y - 2 - y); if (d < bd) { bd = d; best = id; } } if (best) { mapSel = best; snd('ui'); renderPanel(); } });
}

const consText = c => c.type === 'potion' ? `Heals ${Math.round(c.heal * 100)}%` : c.type === 'food' || c.type === 'elixir' ? `+${c.v} ${c.k} for ${c.n} fights` : [c.stamina ? '+' + c.stamina + ' stamina' : '', c.morale ? '+' + c.morale + ' morale' : ''].filter(Boolean).join(', ');
function pBag() {

function itemModal(it, idx) {
  if (!it) return; const here = C.node(S), forge = (here.type === 'town' || here.type === 'station') && !S.travel, inTown = here.type === 'town' && !S.travel;
  const cur = idx >= 0 ? S.equip[it.slot] : null, u = C.uniqueDef(it);
  const uc = C.upgradeCost(it), rc = C.rerollCost(it); if (!rc.shard) delete rc.shard;
  const cost = c => Object.entries(c).map(([k, v]) => `<span class="chip ${(k === 'gold' ? S.hero.gold : C.has(S, k)) >= v ? '' : 'bad'}">${k === 'gold' ? v + 'g' : v + ' ' + esc(C.bagName(k))}</span>`).join('');
  const wt = it.wtype && C.WEAPON_TYPES[it.wtype];
  const html = `<div class="row">${itemIcon(it)}<div class="grow"><h3 style="border:0">${iname(it)}${tierBadge(it)}</h3><div class="sub">${it.slot}${wt ? ', ' + it.wtype + (wt.desc ? ': ' + esc(wt.desc) : '') : ''}. Item level ${it.ilvl}${it.crafted ? ', crafted' : ''}.</div></div></div>
  <div>${esc(C.describe(it))}</div>${u ? `<div class="legendary">${esc(u.desc)}</div>` : ''}${it.set ? `<div class="set">${esc(C.SETS[it.set].name)}${C.SETS[it.set].desc ? ': ' + esc(C.SETS[it.set].desc) : ''}</div>` : ''}
  ${cur ? `<h4>Equipped: ${iname(cur)}</h4><div class="sub">${esc(C.describe(cur))}</div>` : ''}
  ${forge ? `<h4>Temper to +${it.up + 1}</h4>${it.up >= 10 ? 'Maxed' : cost(uc)}${!it.unique && it.rarity !== 'common' ? `<h4>Re-enchant affixes</h4>${cost(rc)}` : ''}` : ''}`;
  const b = [];
  const reopen = () => { const j = idx >= 0 ? S.inv.indexOf(it) : -1; itemModal(it, j); return true; };
  if (idx >= 0) b.push(['Equip', () => { C.equip(S, idx); snd('ui'); }, 'go']);
  if (forge && it.up < 10) b.push(['Temper', () => { if (C.upgrade(S, it)) snd('craft'); else toast('Missing materials'); return reopen(); }]);
  if (forge && !it.unique && it.rarity !== 'common') b.push(['Re-enchant', () => { if (C.reroll(S, it)) snd('craft'); else toast('Missing materials'); return reopen(); }]);
  if (idx >= 0) { b.push(['Salvage', () => { const g = C.salvage(S, idx); toast('Salvaged: ' + Object.entries(g).map(([k, v]) => v + ' ' + C.bagName(k)).join(', ')); }, 'warn']); if (inTown) b.push([`Sell ${C.sellPrice(S, C.itemValue(it))}g`, () => { C.sell(S, idx); snd('coin'); }]); }
  b.push(['Close']); modal(html, b);
}

  }).join('');

}

// ---------- offline ----------
function offline(force) {
  const el = force || Date.now() - (S.last || Date.now()); if (el < 90e3) return null;
  B = null; battleQ = []; fishMG = null; const ms = Math.min(el, 8 * 3600e3), sum = C.simulate(S, ms);
  const mats = Object.entries(sum.bag).map(([k, v]) => `<span class="chip">${bagIcon(k)}${v} ${esc(C.bagName(k))}</span>`).join('');
  const best = sum.items.slice().sort((a, b) => C.RAR.indexOf(b.rarity) - C.RAR.indexOf(a.rarity)).slice(0, 5).map(it => `<div>${itemIcon(it)} ${iname(it)}</div>`).join('');
  modal(`<h3>While you were away: ${dur(ms / 1000)}${el > ms ? ' (capped at 8h)' : ''}</h3>
  <div class="kv"><b>Fights</b><span>${sum.wins} won, ${sum.losses} lost</span><b>Level</b><span>${sum.lvl0} to ${sum.lvl}</span><b>Gold</b><span>${sum.gold >= 0 ? '+' : ''}${fmt(sum.gold)}</span><b>Fish</b><span>${sum.fish}</span><b>Gathered</b><span>${sum.gathered}</span><b>Shops</b><span>${fmt(sum.shop)}g, ${sum.sales} sales</span></div>
  ${sum.arrived ? `<div>Arrived at ${C.NODES[sum.arrived].name}.</div>` : ''}${sum.bosses.length ? `<div class="legendary">Defeated: ${sum.bosses.join(', ')}</div>` : ''}${sum.skillUps.length ? `<div class="lvl">${sum.skillUps.join(', ')}</div>` : ''}
  ${best ? '<h4>Best finds</h4>' + best : ''}${mats ? '<h4>Materials</h4>' + mats : ''}${sum.equipped.length ? `<div class="sub">Auto-equipped ${sum.equipped.length} upgrade${sum.equipped.length > 1 ? 's' : ''}.</div>` : ''}`, [['Continue', null, 'go']]);
  C.log(S, `Away ${dur(ms / 1000)}: ${sum.wins} wins, ${sum.fish} fish, ${sum.gold >= 0 ? '+' : ''}${fmt(sum.gold)}g.`);
  save(); return sum;
}
