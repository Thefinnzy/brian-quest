*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07060f;color:#f0ecdc;font:16px/1.25 BQPixel,monospace;-webkit-font-smoothing:none;font-smooth:never;image-rendering:pixelated}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1a1838,#07060f 70%)}
#app{display:flex;gap:8px;padding:8px;max-width:1280px;margin:0 auto;align-items:flex-start}
#left{flex:0 0 auto;width:min(100%,780px);display:flex;flex-direction:column;gap:6px}
#right{flex:1;min-width:300px;display:flex;flex-direction:column;gap:6px}
@media (max-width:980px){#app{flex-direction:column;padding:4px;gap:4px}#left,#right{width:100%;min-width:0}}
header{display:flex;justify-content:space-between;align-items:center}
header b{color:#ffd860;letter-spacing:1px}#where{color:#b8c4ff}
#hdrR{display:flex;gap:8px;align-items:center}#gold{color:#ffd860;white-space:nowrap}
#stage{padding:3px;background:#120a18;position:relative}
#cv{display:block;width:100%;aspect-ratio:256/176;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.bar{position:relative;height:18px;background:#120a18;border:2px solid #000;box-shadow:0 0 0 1px #7484e0}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .25s}
.bar span{position:relative;display:block;text-align:center;font-size:16px;line-height:14px;text-shadow:1px 1px #000}
.hp i{background:repeating-linear-gradient(180deg,#ff6a5a 0 4px,#d03030 4px 9px,#801828 9px 14px)}
.xp i{background:repeating-linear-gradient(180deg,#a8e0ff 0 4px,#4a8ef0 4px 9px,#28408a 9px 14px)}
.st i{background:repeating-linear-gradient(180deg,#f0f080 0 4px,#c0a030 4px 9px,#6a5418 9px 14px)}
.mo i{background:repeating-linear-gradient(180deg,#c8a0ff 0 4px,#8a5ad8 4px 9px,#4a2a8a 9px 14px)}
#actions{display:flex;flex-wrap:wrap;gap:5px;min-height:46px;align-items:center}
button{font:inherit;color:#f6f2e4;background:linear-gradient(180deg,#5a6ad0,#2a3488);border:2px solid #f6eed6;outline:2px solid #120a18;border-radius:3px;padding:3px 9px;cursor:pointer;text-shadow:1px 1px #1c1020;display:inline-flex;align-items:center;gap:4px;min-height:30px}
button:hover:not(:disabled){background:linear-gradient(180deg,#7a8af0,#3a46a8)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.on{background:linear-gradient(180deg,#e0b040,#8a5a18);color:#fff}
button.warn{background:linear-gradient(180deg,#d05a4a,#7a2028)}
button.go{background:linear-gradient(180deg,#5ac05a,#1e6a2a)}
button .cd{color:#ffd860}
.ib{padding:2px 4px;min-height:0}
img.ic{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;flex:0 0 auto}
button img.ic{width:24px;height:24px}
#tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px}
#tabs button{flex-direction:row;padding:2px 4px;gap:4px;min-height:34px;justify-content:center;overflow:hidden}
#tabs button.on{background:linear-gradient(180deg,#f0c860,#a06a20)}
@media (max-width:520px){#tabs button span{display:none}}
#panel{max-height:calc(100vh - 90px);overflow:auto;min-height:300px}
@media (max-width:980px){#panel{max-height:none}}
h3{color:#ffd860;font-size:16px;margin:6px 0 4px;letter-spacing:1px;border-bottom:2px solid #5a6ac8;padding-bottom:2px}
h4{color:#b8c4ff;font-size:16px;margin:6px 0 2px}
.row{display:flex;align-items:center;gap:6px;padding:3px 2px;border-bottom:1px solid #2a347a}
.row .grow{flex:1;min-width:0}
.row .sub{color:#a8b0e0;font-size:16px}
.muted{color:#8890c0}.good{color:#7ae07a}.bad{color:#ff7a6a}.gold{color:#ffd860}
.common{color:#d8d4cc}.uncommon{color:#6ae06a}.rare{color:#6aa8ff}.epic{color:#c88aff}.legendary{color:#ffb040}.set{color:#50e0c0}.lvl{color:#ffd860}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}

// ---------- offline ----------
function offline(force) {
  const el = force || Date.now() - (S.last || Date.now()); if (el < 90e3) return null;
  C.dropBattle(S); B = null; battleQ = []; fishMG = null; const ms = Math.min(el, 8 * 3600e3), sum = C.simulate(S, ms); /* QA 184f6fb #1: a fight dropped while away ends, so it can't lock respec */
  const mats = Object.entries(sum.bag).map(([k, v]) => `<span class="chip">${bagIcon(k)}${v} ${esc(C.bagName(k))}</span>`).join('');
  const best = sum.items.slice().sort((a, b) => C.RAR.indexOf(b.rarity) - C.RAR.indexOf(a.rarity)).slice(0, 5).map(it => `<div>${itemIcon(it)} ${iname(it)}</div>`).join('');
  modal(`<h3>While you were away: ${dur(ms / 1000)}${el > ms ? ' (capped at 8h)' : ''}</h3>
  <div class="kv"><b>Fights</b><span>${sum.wins} won, ${sum.losses} lost</span><b>Level</b><span>${sum.lvl0} to ${sum.lvl}</span><b>Coin</b><span>${sum.gold >= 0 ? '+' : ''}${coin(sum.gold)}</span><b>Fish</b><span>${sum.fish}</span><b>Gathered</b><span>${sum.gathered}</span><b>Shops</b><span>${coin(sum.shop)}, ${sum.sales} sales</span></div>
  ${sum.arrived ? `<div>Arrived at ${C.NODES[sum.arrived].name}.</div>` : ''}${sum.bosses.length ? `<div class="legendary">Defeated: ${sum.bosses.join(', ')}</div>` : ''}${sum.skillUps.length ? `<div class="lvl">${sum.skillUps.join(', ')}</div>` : ''}
  ${best ? '<h4>Best finds</h4>' + best : ''}${mats ? '<h4>Materials</h4>' + mats : ''}${sum.equipped.length ? `<div class="sub">Auto-equipped ${sum.equipped.length} upgrade${sum.equipped.length > 1 ? 's' : ''}.</div>` : ''}`, [['Continue', null, 'go']]);
  C.log(S, `Away ${dur(ms / 1000)}: ${sum.wins} wins, ${sum.fish} fish, ${sum.gold >= 0 ? '+' : ''}${coin(sum.gold)}.`);
  save(); return sum;
}

function mgBar(x, X, Y, w, h, zones, v, label) { x.fillStyle = '#120a18'; x.fillRect(X, Y, w, h); for (const [a, b, c] of zones) { x.fillStyle = c; x.fillRect(X + w * Math.max(0, a), Y, w * (Math.min(1, b) - Math.max(0, a)), h); } x.fillStyle = '#ffffff'; x.fillRect(X + w * Math.max(0, Math.min(1, v)) - 2, Y - 4, 4, h + 8); x.fillStyle = '#f6eed6'; x.font = '12px monospace'; x.textAlign = 'left'; x.fillText(label, X, Y - 6); }

  pad('mgL', 'L'); pad('mgR', 'R'); el.querySelectorAll('[data-mgc]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); def.tapCrack(g, +b.dataset.mgc); }));

  $('mgQuit').onclick = () => endMG(true); }
